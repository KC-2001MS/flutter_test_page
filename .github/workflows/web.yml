name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  # Dependabotの自動マージ後にデプロイを起動するため（下の automerge ジョブを参照）
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        run: |
          # 最新の安定版（stable）のFlutterを使う
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter
          echo "${GITHUB_WORKSPACE}/_flutter/bin" >> ${GITHUB_PATH}

      - name: Install
        run: |
          flutter config --enable-web
          flutter pub get

      # 動作確認（静的解析とテスト）。失敗した場合はビルド・デプロイ・自動マージを行わない
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 元サイトと同じく、ビルド時にApp Storeの価格を取得する
      - name: Fetch App Store prices
        run: dart run tool/fetch_prices.dart

      - name: Build
        run: flutter build web --base-href /flutter_test_page/ --source-maps

      # URLに "#" を付けないため、ページごとの index.html と 404.html を配置する
      - name: Generate route pages
        run: dart run tool/generate_route_pages.dart

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  # DependabotのPRは、解析・テスト・ビルドがすべて成功したら自動でマージする
  # - 互換性のない変更を含みうるメジャーバージョンの更新は、手動で確認するため対象外
  # - Actions（GITHUB_TOKEN）によるマージでは main へのプッシュのワークフローが起動しないため、
  #   マージ後にこのワークフローを main で起動してデプロイする
  automerge:
    needs: deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Merge and deploy
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge "$PR_URL" --squash
          gh workflow run web.yml --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
