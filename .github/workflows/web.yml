name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        run: |
          # 最新の安定版（stable）のFlutterを使う
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter
          echo "${GITHUB_WORKSPACE}/_flutter/bin" >> ${GITHUB_PATH}

      - name: Install
        run: |
          flutter config --enable-web
          flutter pub get

      # 元サイトと同じく、ビルド時にApp Storeの価格を取得する
      - name: Fetch App Store prices
        run: dart run tool/fetch_prices.dart

      - name: Build
        run: flutter build web --base-href /flutter_test_page/ --source-maps

      # URLに "#" を付けないため、ページごとの index.html と 404.html を配置する
      - name: Generate route pages
        run: dart run tool/generate_route_pages.dart

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web