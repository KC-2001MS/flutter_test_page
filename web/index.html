<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>【SwiftUIアプリ開発】いろいろポートフォリオ</title>
  <meta name="description" content="茅根啓介（活動名：いろいろ）のポートフォリオサイトです。Appleプラットフォームでアプリケーションを展開しております。このサイトでは、App Storeでリリースしたアプリの情報とサポート等を行います。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="SwiftUI, 茅根啓介">
  <meta name="date" content="2024-04-23">
  <meta property="og:type" content="article" />
  <meta property="og:title" content="【SwiftUIアプリ開発】いろいろポートフォリオ" />
  <meta property="og:description"
      content="茅根啓介（活動名：いろいろ）のポートフォリオサイトです。Appleプラットフォームでアプリケーションを展開しております。このサイトでは、リリースしたアプリの情報とサポート等を行います。" />
  <meta property="og:site_name" content="いろいろのポートフォリオ" />
  <meta property="og:image" content="https://iroiro.dev/css/image/出雲大社1080.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@IroIro1234work" />
  <meta name="format-detection" content="email=no,telephone=no,address=no">
  <meta name="google" content="nositelinkssearchbox">
  <meta name="language" content="Japanese">
  <meta http-equiv="content-language" content="ja">
  <meta name="author" content="茅根啓介">
  <meta name="copyright" content="© 2024 Keisuke Chinone">
  <!-- Flutterでの再現を試す検証用ページのため、検索結果には載せない -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv='x-dns-prefetch-control' content='on'>
  <meta http-equiv="Expires" content="604800">
  <link rel="me" href="https://mastodon.social/@Iroiro">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="test_flutter_page">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico"/>
  <link rel="manifest" href="manifest.json">
  <!-- 以前の "#/product" 形式のURLは、"#" のないURL（/flutter_test_page/product）に置き換える -->
  <script>
    if (location.hash.startsWith("#/")) {
      const base = document.baseURI.replace(/\/$/, "");
      history.replaceState(null, "", base + location.hash.slice(1));
    }
  </script>
  <!-- Flutterが起動するまでの読み込み中の表示（起動後に flutter_bootstrap.js で消す） -->
  <style>
    body {
      margin: 0;
      background-color: rgb(200, 200, 200);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: rgb(200, 200, 200);
      color: rgb(25, 25, 25);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      transition: opacity 0.3s;
    }

    #loading.hidden {
      opacity: 0;
    }

    #loading h1 {
      margin: 0;
      font-size: 30px;
    }

    #loading p {
      margin: 0;
      font-size: 14px;
      opacity: 0.7;
    }

    @media (prefers-color-scheme: dark) {
      body,
      #loading {
        background-color: rgb(55, 55, 55);
        color: rgb(230, 230, 230);
      }
    }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <h1>いろいろポートフォリオ</h1>
    <p>読み込み中…</p>
  </div>
  <script>
    // 英語版のページでは、読み込み中の表示も英語にする
    if (/^\/en(\/|$)/.test(location.pathname.slice(new URL(document.baseURI).pathname.length - 1))) {
      document.documentElement.lang = "en";
      document.querySelector("#loading h1").textContent = "Iroiro's portfolio";
      document.querySelector("#loading p").textContent = "Loading…";
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
